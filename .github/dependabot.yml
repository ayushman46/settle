# Keeps the GitHub Actions these workflows use up to date: one grouped pull request a week, which
# CI checks like any other. npm packages are pinned on purpose and updated by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
