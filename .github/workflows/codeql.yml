# Security scanning: CodeQL reads the app, the server, the Edge Function and these workflows for
# security bugs (injection, unsafe redirects, leaked tokens, risky workflow patterns). Findings show
# under Security → Code scanning. On every pull request, every push to main, and weekly, so new
# CodeQL checks run against code that hasn't changed.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "27 3 * * 1"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL · ${{ matrix.language }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
