# The Android app (android/): Settle in a Capacitor shell that loads the live site, plus
# Auto-settle's payment-alerts listener. Every push that touches it builds a debug APK, kept as a
# download on the run for 30 days (install it on a phone to try Auto-settle). Play Store builds
# need a release key and are made by hand.
name: Android

on:
  push:
    branches: [main]
    paths:
      - android/**
      - capacitor.config.json
      - native/**
      - package-lock.json
      - .github/workflows/android.yml
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # Publishing the APK as a release download.
  contents: write

jobs:
  apk:
    name: Debug APK
    # 24.04 comes with the Android SDK (ubuntu-latest is moving to 26).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties && ls "$ANDROID_HOME/platforms"
      - name: Copy the shell page, config and plugins into the Android project
        run: npx cap sync android
      - name: Build the debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v7
        with:
          name: settle-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
      # The download on /get. The app is a shell around the live site and updates itself, so the file
      # is published once and kept (each build is signed with a fresh debug key, and Android will
      # not install one over another): run this workflow by hand to replace it.
      - name: Publish the APK as a download
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk settle-android.apk
          if ! gh release view android-latest >/dev/null 2>&1; then
            gh release create android-latest settle-android.apk --title "Settle for Android" --notes "The Android app: Settle with payment alerts (Auto-settle, Split this?). Debug build, not on the Play Store. Install: download settle-android.apk on your phone and open it." --latest=false
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            gh release upload android-latest settle-android.apk --clobber
          fi
