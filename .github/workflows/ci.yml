# Every push to main and every pull request: typecheck, lint, the unit/server test suite, the
# production build (served and probed exactly as Render runs it), the Cloudflare Pages build, and
# the Playwright smoke journeys on Microsoft Edge as phones. Render deploys main only once these
# pass (render.yaml: autoDeployTrigger: checksPass).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CI: "true"
  # Never call the real AI from CI, whatever the environment holds.
  NVIDIA_API_KEY: ""

jobs:
  check:
    name: Typecheck · lint · tests · build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Typecheck (app, server, Pages Function, E2E)
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit and server tests
        run: npx vitest run --maxWorkers=2
      - name: Production build
        run: npm run build
      - name: Cloudflare Pages build (404 page, headers, rewrites)
        run: node scripts/pages-build.mjs
      - name: Serve the build like Render and probe it
        run: |
          PORT=4130 node dist/server/index.js > server.log 2>&1 &
          server=$!
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:4130/api/health > /dev/null && break; sleep 1; done
          probe() { # path, expected status
            status=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:4130$1")
            echo "$1 -> $status"; test "$status" = "$2"
          }
          probe /api/health 200
          probe / 200
          probe /app 200
          probe /app/groups 200
          probe /pay 200
          probe /privacy 200
          probe /sw.js 200
          probe /manifest.webmanifest 200
          probe /assets/missing.js 404
          probe /no-such-page 404
          curl -fsI http://127.0.0.1:4130/app | grep -i '^content-security-policy:'
          curl -fs http://127.0.0.1:4130/api/health | grep -q '"ok":true'
          kill "$server"
      - name: Server log
        if: ${{ !cancelled() }}
        run: cat server.log || true

  e2e:
    name: E2E · Edge · phones (360/390, light/dark)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Microsoft Edge
        run: |
          if command -v microsoft-edge-stable > /dev/null; then microsoft-edge-stable --version
          else npx playwright install --with-deps msedge; fi
      - name: Smoke journeys on the production build
        run: npx playwright test
      - name: Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
