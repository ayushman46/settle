<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Settle — offline</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f4f5f7;
        --ink: #141413;
        --ink-2: #55575d;
        --accent: #d8f57c;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b0c0e;
          --ink: #f4f5f7;
          --ink-2: #a9abb1;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        background: var(--bg);
        color: var(--ink);
        font: 16px/1.5 system-ui, sans-serif;
        text-align: center;
      }
      h1 {
        font-size: 24px;
        margin: 0 0 8px;
      }
      p {
        color: var(--ink-2);
        margin: 0 0 24px;
      }
      button {
        min-height: 48px;
        padding: 0 28px;
        border: 0;
        border-radius: 999px;
        background: var(--accent);
        color: #141413;
        font: 600 16px system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You’re offline</h1>
      <p>Settle needs a connection the first time it opens. After that, your splits open without one.</p>
      <button type="button" onclick="location.href = 'https://settleupi.vercel.app/app'">Try again</button>
    </main>
  </body>
</html>
